version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3335:3333" # map container 3333 to host 3335 to avoid local dev port conflicts
    env_file:
      - ./staging.env
    depends_on:
      - db
      - redis
    restart: unless-stopped
