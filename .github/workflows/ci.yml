name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tcg_singles_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U ${{ job.services.postgres.env.POSTGRES_USER }} -d ${{ job.services.postgres.env.POSTGRES_DB }}'
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/tcg_singles_db
        run: npm run prisma:generate

      - name: Push Prisma schema to Postgres
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/tcg_singles_db
        run: npm run prisma:push -- --accept-data-loss

      - name: Type-check (backend)
        working-directory: backend
        run: npm run type-check

      - name: Run fast backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/tcg_singles_db
          REDIS_URL: redis://localhost:6379
          FAST_TEST: 'true'
        run: npm run test:fast
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run backend/frontend tests (default false)'
        required: false
        default: 'false'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Generate Prisma client
        run: npm --prefix backend run prisma:generate

      - name: Type-check (backend + frontend)
        run: npm run type-check

      - name: Lint (backend)
        run: npm --prefix backend run lint

      - name: Build (backend + frontend)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            backend/dist
            frontend/dist

      - name: Run tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run-tests == 'true' }}
        run: |
          npm --prefix backend run test || true
          npm --prefix frontend run test || true

  tests:
    name: Tests (PRs)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run-tests == 'true') }}
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tcg_singles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tcg_singles_test
      REDIS_URL: redis://localhost:6379
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Wait for Postgres and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          until redis-cli -h localhost ping | grep PONG; do sleep 1; done

      - name: Apply Prisma migrations
        run: |
          cd backend
          npx prisma migrate deploy

      - name: Generate Prisma client
        run: npm --prefix backend run prisma:generate

      - name: Seed database (optional)
        run: npm --prefix backend run prisma:seed

      - name: Run backend tests
        run: npm --prefix backend run test

      - name: Run frontend tests
        run: npm --prefix frontend run test
