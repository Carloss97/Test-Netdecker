name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run backend/frontend tests (default false)'
        required: false
        default: 'false'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Generate Prisma client
        run: npm --prefix backend run prisma:generate

      - name: Type-check (backend + frontend)
        run: npm run type-check

      - name: Lint (backend)
        run: npm --prefix backend run lint

      - name: Build (backend + frontend)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            backend/dist
            frontend/dist

      - name: Run tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run-tests == 'true' }}
        run: |
          npm --prefix backend run test || true
          npm --prefix frontend run test || true
