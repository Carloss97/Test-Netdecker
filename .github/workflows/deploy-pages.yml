name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    name: Build frontend and deploy to Pages
    runs-on: ubuntu-latest
    env:
      FRONTEND_DIR: frontend
      DIST_DIR: frontend/dist
      PAGES_PROJECT: tcg-erp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix ${{ env.FRONTEND_DIR }} ci

      - name: Build frontend
        run: npm --prefix ${{ env.FRONTEND_DIR }} run build
        env:
          CI: 'true'

      - name: List build output
        run: |
          echo "Listing ${{ env.DIST_DIR }}"
          ls -la ${{ env.DIST_DIR }}

      - name: Validate Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Validating Cloudflare API token (whoami)..."
          npx --yes wrangler@4.83.0 whoami
          echo "Listing Pages projects accessible by token..."
          npx --yes wrangler@4.83.0 pages project list

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Deploying ${PAGES_PROJECT} from ${{ env.DIST_DIR }}..."
          npx --yes wrangler@4.83.0 pages deploy ${{ env.DIST_DIR }} --project-name ${PAGES_PROJECT} --branch main
